# Publishes the BRouter test tiles as a release (dispatch 2026-10-28-01, Amendment 4; RECORD -30). The owner runs it
# from main with "Run workflow". A push to brouter-port runs `capture` alone, as a dry run; `publish` never runs on a push.
# Every file it runs comes from brouter-port at TOOLS_SHA, never from main's tree. Actions are pinned by commit SHA, read
# with `git ls-remote` on 2026-10-29.
name: publish-tiles

on:
  workflow_dispatch:
  push:
    branches: [brouter-port]
    paths: ['.github/workflows/publish-tiles.yml', 'tools/tile-check/**']

permissions: {}

env:
  # brouter-port's commit holding tools/: the check, the fetch scripts, the README and notes. Every file the run
  # executes comes from it. The release does not target it; it targets the run's own commit on main (RECORD -43).
  TOOLS_SHA: 5d0076179af84f0dd88b57ae83898ee6db86f1b9
  # F0, Forager's test fixture, refused unless it matches these pins (Phase 2, step 1).
  F0_URL: https://raw.githubusercontent.com/slayer8366/Forager/e2969abe4f98674c24ce3913ce97be568184a4de/app/src/test/resources/routing/segments/W75_N40.rd5
  F0_BYTES: '152665'
  F0_SHA256: ff6d9d8e439c3cdf914b1566619f64466d9af993c28070ea893425e7f5ec5990

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TOOLS_SHA }}
          persist-credentials: false
      - name: On a push, refuse if the branch's tools differ from TOOLS_SHA's, which this run would test instead
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git diff --stat --exit-code "$TOOLS_SHA" "$GITHUB_SHA" -- tools/tile-check tools/tile-release \
            tools/fetch-oracle.sh tools/fetch-pinned.sh tools/fetch-tiles.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Capture F0 and the four tiles, and check each in BRouter 1.7.10
        run: tools/tile-check/capture.sh out https://brouter.de/brouter/segments4 "$F0_URL" "$F0_BYTES" "$F0_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tile-release
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: capture
    # The guard. A push is never workflow_dispatch, so a push-triggered run skips this job on every branch.
    if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency: publish-tiles
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TOOLS_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tile-release
          path: out
      - name: Refuse if the tag, or a release with that tag, already exists
        run: |
          tag=$(cat out/tag)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          refs=$(git ls-remote --tags origin "refs/tags/$tag")
          releases=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if [ -n "$refs" ] || grep -qxF "$tag" <<< "$releases"; then echo "REFUSED: $tag already exists"; exit 1; fi
      # The target is GITHUB_SHA, this run's own commit. The guard admits only a workflow_dispatch run from main, so
      # it is main's commit, which modifies no file under .github/workflows/ relative to main, the default branch.
      # TOOLS_SHA does (it holds brouter.yml, main holds publish-tiles.yml), and GitHub refuses a release whose target
      # does unless the token may modify workflows, which GITHUB_TOKEN cannot be: run 40993150859's 403 (RECORD -43).
      - name: Create a draft release targeting this run's commit on main, with the seven assets
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "BRouter test tiles, ${TAG#brouter-tiles-}" \
            --notes-file out/release-notes.md out/assets/*
      - name: Download every asset back and compare it with the pins
        run: |
          count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$count" != 7 ]; then echo "REFUSED: the draft holds $count assets, not 7"; exit 1; fi
          gh release download "$TAG" --dir readback
          cmp out/assets/README.md readback/README.md
          cmp out/assets/tile-pins.tsv readback/tile-pins.tsv
          tools/fetch-tiles.sh checked "file://$PWD/readback" readback/tile-pins.tsv
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
