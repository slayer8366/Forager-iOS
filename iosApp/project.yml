# The Xcode project for the iOS app (A1-2; pre-build sections 4 and 5, RECORD -201 T4, T10, T11). XcodeGen 2.46.0
# generates iosApp/ForagerApp.xcodeproj from this file on the runner; the generated project is not committed (nobody
# here can open Xcode), it is uploaded as a CI artifact so it can be read. Unsigned simulator builds only (the owner:
# "When a signed build is wanted (Recommended)").
name: ForagerApp

options:
  deploymentTarget:
    iOS: "16.0" # provisional (RECORD -201 T11): A2's map library may set its own floor

targets:
  ForagerApp:
    type: application
    platform: iOS
    sources:
      - path: ForagerApp
    info:
      path: ForagerApp/Info.plist # generated by XcodeGen on each run; not committed
      properties:
        # PLACEHOLDER (RECORD -202, the owner: "Placeholder for now (Recommended)"): the display name, and the bundle
        # identifier in PRODUCT_BUNDLE_IDENTIFIER below, are to be replaced when the owner names the app.
        CFBundleDisplayName: Forager dev
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Compose Multiplatform expects this key (JetBrains' templates carry it).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # PLACEHOLDER (RECORD -202): see the comment on CFBundleDisplayName above.
        PRODUCT_BUNDLE_IDENTIFIER: com.zynergylabs.forager.ios.dev
        CODE_SIGNING_ALLOWED: "NO"
        # The Kotlin framework's module is ForagerApp (app/build.gradle.kts, baseName), and the app's Swift module would
        # default to its product name, also ForagerApp; Swift cannot import a module of its own name. So the app's Swift
        # module is renamed here; the product (ForagerApp.app, executable ForagerApp) keeps its name.
        PRODUCT_MODULE_NAME: ForagerIOS
        # Kotlin's direct integration: the Run Script below runs Gradle, which a sandboxed script cannot.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Where embedAndSignAppleFrameworkForXcode puts the static framework (Kotlin 2.3.10, AppleXcodeTasks.kt:419),
        # as JetBrains' KMP-App-Template sets it; the -framework flag as compose-multiplatform-ios-android-template sets it.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ForagerApp"
    # Kotlin's documented Run Script phase (kotlinlang.org, "Direct integration"), before Compile Sources, with
    # "Based on dependency analysis" off. --console=plain is this project's addition, so the task headers reach the
    # xcodebuild log in a form CI can check.
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew --console=plain :app:embedAndSignAppleFrameworkForXcode

schemes:
  ForagerApp:
    build:
      targets:
        ForagerApp: all
    run:
      config: Debug
